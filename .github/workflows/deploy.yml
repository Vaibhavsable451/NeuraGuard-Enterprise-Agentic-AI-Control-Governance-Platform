name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI", "Evaluation Gate"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/NeuraGuard-Enterprise-Agentic-AI-Control-Governance-Platform || cd ~/aegis-ai || exit 1
            git pull origin main
            pip install -r requirements.txt
            
            # Restart FastAPI Backend (Port 8000)
            pkill -f "uvicorn app.api.main:app" || true
            nohup uvicorn app.api.main:app --host 0.0.0.0 --port 8000 > logs_api.log 2>&1 &
            
            # Restart Streamlit Frontend (Port 8501)
            pkill -f "streamlit run" || true
            nohup streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0 > logs_streamlit.log 2>&1 &
            
            echo "Deployment completed successfully on AWS EC2!"

