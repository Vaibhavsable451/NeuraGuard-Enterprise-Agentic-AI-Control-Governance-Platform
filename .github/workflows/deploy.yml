name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI", "Evaluation Gate"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            cd ~/NeuraGuard-Enterprise-Agentic-AI-Control-Governance-Platform || cd ~/aegis-ai || exit 1

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Installing dependencies ==="
            .venv/bin/python -m pip install -r requirements.txt

            echo "=== Stopping old services ==="
            if [ -f fastapi.pid ]; then
              kill $(cat fastapi.pid) 2>/dev/null || true
              rm -f fastapi.pid
            fi

            if [ -f streamlit.pid ]; then
              kill $(cat streamlit.pid) 2>/dev/null || true
              rm -f streamlit.pid
            fi

            sleep 2

            echo "=== Starting FastAPI ==="
            nohup .venv/bin/uvicorn app.api.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              > logs_api.log 2>&1 < /dev/null &
            echo $! > fastapi.pid

            echo "=== Starting Streamlit ==="
            nohup .venv/bin/streamlit run streamlit_app/app.py \
              --server.port 8501 \
              --server.address 0.0.0.0 \
              > logs_streamlit.log 2>&1 < /dev/null &
            echo $! > streamlit.pid

            sleep 3

            echo "=== Checking services ==="
            curl -s http://127.0.0.1:8000/docs > /dev/null
            curl -s http://127.0.0.1:8501 > /dev/null

            echo "=== DEPLOYMENT SUCCESS ==="









