name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI", "Evaluation Gate"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            echo "=== Starting deployment ==="

            cd ~/NeuraGuard-Enterprise-Agentic-AI-Control-Governance-Platform || cd ~/aegis-ai || exit 1

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Checking virtual environment ==="
            if [ ! -x ".venv/bin/python" ]; then
              python3 -m venv .venv
            fi

            echo "=== Installing dependencies ==="
            .venv/bin/python -m pip install --upgrade pip --quiet
            .venv/bin/python -m pip install -r requirements.txt

            echo "=== Stopping old FastAPI process ==="
            if [ -f fastapi.pid ]; then
              kill "$(cat fastapi.pid)" 2>/dev/null || true
              rm -f fastapi.pid
            fi

            echo "=== Stopping old Streamlit process ==="
            if [ -f streamlit.pid ]; then
              kill "$(cat streamlit.pid)" 2>/dev/null || true
              rm -f streamlit.pid
            fi

            sleep 2

            echo "=== Starting FastAPI Backend ==="
            nohup .venv/bin/uvicorn app.api.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              </dev/null > logs_api.log 2>&1 &

            echo $! > fastapi.pid

            echo "=== Starting Streamlit Frontend ==="
            nohup .venv/bin/streamlit run streamlit_app/app.py \
              --server.port 8501 \
              --server.address 0.0.0.0 \
              </dev/null > logs_streamlit.log 2>&1 &

            echo $! > streamlit.pid

            sleep 3

            echo "=== Checking processes ==="
            ps -p "$(cat fastapi.pid)" -o pid,cmd || true
            ps -p "$(cat streamlit.pid)" -o pid,cmd || true

            echo "=== Testing ports ==="
            curl -I http://127.0.0.1:8000/docs || true
            curl -I http://127.0.0.1:8501 || true

            echo "=== Deployment completed successfully ==="








