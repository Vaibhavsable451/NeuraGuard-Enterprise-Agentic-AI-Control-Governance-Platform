name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI", "Evaluation Gate"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            echo "=== Starting deployment ==="

            cd ~/NeuraGuard-Enterprise-Agentic-AI-Control-Governance-Platform || cd ~/aegis-ai || exit 1

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Setting up virtual environment ==="
            if [ ! -x ".venv/bin/python" ]; then
              python3 -m venv .venv
            fi

            echo "=== Installing dependencies ==="
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            echo "=== Restarting FastAPI ==="
            pkill -f '[u]vicorn app.api.main:app' || true
            nohup .venv/bin/uvicorn app.api.main:app \
              --host 0.0.0.0 \
              --port 8000 > logs_api.log 2>&1 &

            echo "=== Restarting Streamlit ==="
            pkill -f '[s]treamlit run' || true
            nohup .venv/bin/streamlit run streamlit_app/app.py \
              --server.port 8501 \
              --server.address 0.0.0.0 > logs_streamlit.log 2>&1 &

            echo "=== Deployment completed successfully ==="







